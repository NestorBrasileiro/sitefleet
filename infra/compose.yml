services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: sitefleet-web:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - '3000'
    networks: [edge]
    # Um processo Next serve a frota inteira. Se um dia um site sozinho
    # justificar isolamento, duplique este serviço e mande o Caddy rotear
    # aquele domínio para o novo container.
    deploy:
      resources:
        limits:
          memory: 1g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
