packages:
  - 'apps/*'
  - 'packages/*'
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - next@16.4.1
  - turbo@2.11.3
# @tailwindcss/typography@0.5.20 (último release) ainda pede
# postcss-selector-parser ^6.0.10, e o fix do GHSA-rj75-hqrm-r3gf /
# CVE-2026-104844 só existe a partir de 7.1.6 — não há backport na linha 6.x.
# Sem release do parent para subir, o override é a única saída.
overrides:
  postcss-selector-parser@<7.1.6: '7.1.6'
